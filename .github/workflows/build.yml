name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          set -eux
          mkdir -p project
          unzip -o project.zip -d project
          find project -maxdepth 3 | head -100

      - name: Build APK
        run: |
          set -eux
          GW="$(find project -name gradlew -type f | head -1)"
          if [ -n "$GW" ]; then
            cd "$(dirname "$GW")"
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            CMD=./gradlew
          else
            S="$(find project \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)"
            [ -n "$S" ] || { echo "No Gradle project found"; exit 1; }
            cd "$(dirname "$S")"
            CMD=gradle
          fi
          $CMD assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
